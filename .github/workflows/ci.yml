name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .[dev]

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest tests -q

      - name: Quick V&V suite (small grids)
        run: stent-hemo validate --quick

  openfoam-crosscheck:
    runs-on: ubuntu-latest
    container:
      image: openfoam/openfoam11-paraview510
      # Run as root: the checkout action writes the runner-mounted
      # temporary files, which the image's non-root `openfoam` user
      # cannot write (EACCES on /__w/_temp/_runner_file_commands/*).
      options: --user 0
    steps:
      - uses: actions/checkout@v4
      - name: Generate cases
        # The OpenFOAM image ships Python 3.8 (no pip); install pip via apt,
        # then run the case generator via PYTHONPATH (the package declares
        # requires-python >= 3.8 now).
        run: |
          apt-get update -qq && apt-get install -y -qq python3-pip
          python3 -m pip install --quiet numpy scipy matplotlib
          PYTHONPATH=src python3 -m stent_hemo.pipeline cases
      - name: Diagnostics — image tools, case dictionaries, Allrun
        shell: bash
        run: |
          export PATH="/opt/openfoam11/platforms/linux64GccDPInt32Opt/bin:$PATH"
export LD_LIBRARY_PATH="/opt/openfoam11/platforms/linux64GccDPInt32Opt/lib:$LD_LIBRARY_PATH"
          echo "WM_PROJECT_VERSION=${WM_PROJECT_VERSION:-v11} (image openfoam11-paraview510)"
          echo "FOAM_INSTALL_DIR=${FOAM_INSTALL_DIR:-/opt/openfoam11}"
          for b in foamRun checkMesh blockMesh postProcess; do
            if command -v "$b" >/dev/null 2>&1; then echo "found $b -> $(command -v $b)"; else echo "MISSING EXECUTABLE: $b"; fi
          done
          for c in openfoam/stenosis_50 openfoam/stenosis_70; do
            echo "case dir: $PWD/$c"
            for f in 0/U 0/p constant/physicalProperties system/controlDict system/fvSchemes system/fvSolution constant/polyMesh/owner constant/polyMesh/neighbour constant/polyMesh/faces constant/polyMesh/points constant/polyMesh/boundary; do
              if [ -s "$c/$f" ]; then echo "  ok: $c/$f"; else echo "  MISSING FILE: $c/$f"; fi
            done
            echo "=== $c/Allrun ==="; cat "$c/Allrun" 2>&1 || echo "(no Allrun)"
            echo "=== $c/constant/polyMesh/boundary ==="; cat "$c/constant/polyMesh/boundary" 2>&1 || true
            echo "=== $c inlet BC ==="; sed -n '/inlet/,/}/p' "$c/0/U" 2>&1 || true
          done
          echo "Diagnostics done."
        timeout-minutes: 10
      - name: checkMesh stenosis_50 (before solver)
        shell: bash
        run: |
          export PATH="/opt/openfoam11/platforms/linux64GccDPInt32Opt/bin:$PATH"
export LD_LIBRARY_PATH="/opt/openfoam11/platforms/linux64GccDPInt32Opt/lib:$LD_LIBRARY_PATH"
          cd openfoam/stenosis_50
          checkMesh 2>&1 | tee checkMesh.log
          echo "checkMesh exit: ${PIPESTATUS[0]}"
        timeout-minutes: 10
      - name: checkMesh stenosis_70 (before solver)
        shell: bash
        run: |
          export PATH="/opt/openfoam11/platforms/linux64GccDPInt32Opt/bin:$PATH"
export LD_LIBRARY_PATH="/opt/openfoam11/platforms/linux64GccDPInt32Opt/lib:$LD_LIBRARY_PATH"
          cd openfoam/stenosis_70
          checkMesh 2>&1 | tee checkMesh.log
          echo "checkMesh exit: ${PIPESTATUS[0]}"
        timeout-minutes: 10
      - name: Inspect mesh quality (stenosis_50)
        run: |
          cd openfoam/stenosis_50
          grep -E "Zero or negative cell volume|Minimum negative volume|Open cells|non-orthogonality|Failed|Faces not in upper|Boundary openness" checkMesh.log | head -15 || echo "(no mesh warning patterns matched)"
        timeout-minutes: 5
      - name: Run wedge case stenosis_50
        shell: bash
        run: |
          export PATH="/opt/openfoam11/platforms/linux64GccDPInt32Opt/bin:$PATH"
export LD_LIBRARY_PATH="/opt/openfoam11/platforms/linux64GccDPInt32Opt/lib:$LD_LIBRARY_PATH"
          set +e
          cd openfoam/stenosis_50
          bash Allrun 2>&1 | tee run.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "stenosis_50 Allrun exit code: $rc"
          test "$rc" -eq 0
        timeout-minutes: 15
      - name: Run wedge case stenosis_70
        shell: bash
        run: |
          export PATH="/opt/openfoam11/platforms/linux64GccDPInt32Opt/bin:$PATH"
export LD_LIBRARY_PATH="/opt/openfoam11/platforms/linux64GccDPInt32Opt/lib:$LD_LIBRARY_PATH"
          set +e
          cd openfoam/stenosis_70
          bash Allrun 2>&1 | tee run.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "stenosis_70 Allrun exit code: $rc"
          test "$rc" -eq 0
        timeout-minutes: 15
      - name: Verify solver time advancement (stenosis_50)
        if: always()
        run: |
          cd openfoam/stenosis_50 2>/dev/null || { echo "case dir missing"; exit 0; }
          echo "--- time dirs (sorted):"; ls -d [0-9]* 2>/dev/null | sort -n | head -40 || true
          echo "--- last 5 lines of log.foamRun:"; tail -5 log.foamRun 2>/dev/null || echo "(no log.foamRun)"
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openfoam-results
          path: |
            openfoam/**/log.*
            openfoam/**/run.log
            openfoam/**/checkMesh.log
            openfoam/**/postProcessing/
            openfoam/**/[0-9]*/
