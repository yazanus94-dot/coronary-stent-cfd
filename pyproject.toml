[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stent-hemo"
version = "0.1.0"
description = "Hemodynamics of a stenosed coronary artery and the effect of a stent: in-house axisymmetric FV solver + OpenFOAM/SU2/CalculiX cross-check decks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yazanus94-dot" }]
keywords = ["CFD", "hemodynamics", "stenosis", "stent", "OpenFOAM", "SU2"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.1",
    "ruff>=0.4",
]
mesh3d = ["gmsh>=4.11"]

[project.scripts]
stent-hemo = "stent_hemo.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
